<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="dutyBarTitle">
  <title id="dutyBarTitle">Ten-minute bar: 2.0 minutes on and 8.0 minutes off at 20 percent</title>
  <rect width="720" height="200" fill="#f6f8fa"/>
  <g font-family="Georgia, serif" fill="#1f2328">
    <text x="24" y="36" font-size="16">20% of a 10-minute period</text>
    <rect x="24" y="64" width="134" height="64" fill="#8f2f12"/>
    <rect x="158" y="64" width="538" height="64" fill="#ffffff" stroke="#1f2328"/>
    <text x="91" y="102" text-anchor="middle" font-size="14" fill="#ffffff">2.0 min on</text>
    <text x="427" y="102" text-anchor="middle" font-size="14">8.0 min off</text>
    <text x="24" y="160" font-size="13">0</text>
    <text x="680" y="160" font-size="13">10 min</text>
  </g>
</svg>
